name: Python tests

on:
  push:
    branches:
      - main
      - feat/iat2-foundation
      - feat/iat2-mt5-data
      - feat/iat2-readonly-api
      - feat/iat2-session-quality
      - feat/iat2-windows-demo
      - feat/iat2-exness-calendar
      - feat/iat2-session-engine-v2
      - feat/iat2-market-intelligence-v1
      - feat/iat2-market-context-v1
      - feat/iat2-historical-replay-validation
  pull_request:
    branches:
      - main
      - feat/iat2-foundation
      - feat/iat2-mt5-data
      - feat/iat2-readonly-api
      - feat/iat2-session-quality
      - feat/iat2-windows-demo
      - feat/iat2-exness-calendar
      - feat/iat2-session-engine-v2
      - feat/iat2-market-intelligence-v1
      - feat/iat2-market-context-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11.9', '3.12']
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Windows runner fail-closed smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $reports = Join-Path $env:RUNNER_TEMP ('iat-smoke-' + [Guid]::NewGuid().ToString('N'))
          $python = (Get-Command python).Source
          & powershell.exe -NoProfile -File diagnostics/Run-IATDemoValidation.ps1 -PythonExe $python -SessionConfig 'missing-fixture.json' -ReportDirectory $reports
          if ($LASTEXITCODE -ne 1) { Write-Output '::error::SMOKE_EXPECTED_FAIL_CLOSED_EXIT'; exit 1 }
          $files = @(Get-ChildItem -LiteralPath $reports -Filter '*.json')
          if ($files.Count -ne 1) { Write-Output '::error::SMOKE_FAILURE_REPORT_MISSING'; exit 1 }
          $report = Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          if ($report.status -ne 'FAIL' -or $report.execution_allowed -ne $false) { Write-Output '::error::SMOKE_UNSAFE_FAILURE_REPORT'; exit 1 }
          if ($report.code -notin @('CONFIG_FILE_UNAVAILABLE', 'PYTHON_311_X64_REQUIRED')) { Write-Output ('::error::SMOKE_UNEXPECTED_PREFLIGHT_CODE_' + $report.code); exit 1 }
          # GitHub's pwsh wrapper otherwise propagates the intentionally failing child's LASTEXITCODE.
          exit 0
      - name: Windows runner missing-package evidence test
        if: runner.os == 'Windows' && startsWith(matrix.python-version, '3.11')
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('iat smoke with spaces ' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root | Out-Null
          $env:IAT_SMOKE_CONFIG = Join-Path $root 'config with spaces.json'
          @'
          import importlib.util, json, os, sys
          from pathlib import Path
          assert importlib.util.find_spec('MetaTrader5') is None, 'No real terminal package may be loaded in this smoke check'
          sys.path.insert(0, 'tests')
          from test_session_config import fixture
          Path(os.environ['IAT_SMOKE_CONFIG']).write_text(json.dumps(fixture()), encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Smoke environment must have no MT5 package' }
          $reports = Join-Path $root 'evidence with spaces'
          $python = (Get-Command python).Source
          & powershell.exe -NoProfile -File diagnostics/Run-IATDemoValidation.ps1 -PythonExe $python -SessionConfig $env:IAT_SMOKE_CONFIG -ReportDirectory $reports
          if ($LASTEXITCODE -ne 1) { throw 'Missing MT5 must fail closed' }
          $files = @(Get-ChildItem -LiteralPath $reports -Filter '*.json')
          if ($files.Count -ne 1) { throw 'Expected one completed failure report' }
          $report = Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          if ($report.status -ne 'FAIL' -or $report.safety.execution_allowed -ne $false) { throw 'Unsafe diagnostic outcome' }
          if ('MT5_UNAVAILABLE' -notin @($report.diagnostics.code)) { throw 'Expected structured missing-package diagnostic' }
          exit 0
      - name: Windows Exness candidate installer and blocked-run smoke test
        if: runner.os == 'Windows' && startsWith(matrix.python-version, '3.11')
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('iat exness with spaces ' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root | Out-Null
          $candidate = Join-Path $root 'candidate with spaces.json'
          $python = (Get-Command python).Source
          & powershell.exe -NoProfile -NonInteractive -File diagnostics/Install-IATExnessCalendar.ps1 -PythonExe $python -Destination $candidate
          if ($LASTEXITCODE -ne 2 -or -not (Test-Path -LiteralPath $candidate)) { throw 'Expected installed but BLOCKED candidate' }
          $before = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash
          & powershell.exe -NoProfile -NonInteractive -File diagnostics/Install-IATExnessCalendar.ps1 -PythonExe $python -Destination $candidate
          if ($LASTEXITCODE -ne 1) { throw 'Replacement must require interactive confirmation' }
          if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash -ne $before) { throw 'Unconfirmed overwrite occurred' }
          $reports = Join-Path $root 'evidence with spaces'
          & powershell.exe -NoProfile -File diagnostics/Run-IATDemoValidation.ps1 -PythonExe $python -SessionConfig $candidate -ReportDirectory $reports
          if ($LASTEXITCODE -ne 1) { throw 'Unverified candidate must fail closed' }
          $files = @(Get-ChildItem -LiteralPath $reports -Filter '*.json')
          if ($files.Count -ne 1) { throw 'Expected one redacted failure report' }
          $report = Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          if ($report.status -ne 'FAIL' -or $report.safety.execution_allowed -ne $false -or $report.safety.binding_initialization_attempted -ne $false) { throw 'Unsafe Exness candidate handling' }
          if ('HOLIDAY_COVERAGE_UNKNOWN' -notin @($report.diagnostics.code)) { throw 'Holiday uncertainty was hidden' }
          if ('SESSION_ALIGNMENT_INVALID' -notin @($report.timeframes.M5.codes)) { throw 'M5 boundary mismatch was hidden' }
          exit 0
      - name: Windows v2 research remains blocked without terminal access
        if: runner.os == 'Windows' && startsWith(matrix.python-version, '3.11')
        shell: pwsh
        run: |
          $reports = Join-Path $env:RUNNER_TEMP ('iat v2 research ' + [Guid]::NewGuid().ToString('N'))
          $python = (Get-Command python).Source
          & powershell.exe -NoProfile -File diagnostics/Run-IATSessionResearch.ps1 -PythonExe $python -SessionConfig 'config/profiles/exness-xauusd-v2.candidate.json' -ReportDirectory $reports -CaptureDemo
          if ($LASTEXITCODE -ne 3) { throw 'Unverified v2 profile must remain BLOCKED' }
          $files = @(Get-ChildItem -LiteralPath $reports -Filter '*.json')
          if ($files.Count -ne 1) { throw 'Expected one v2 research report' }
          $report = Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          if ($report.status -ne 'BLOCKED' -or $report.safety.execution_allowed -ne $false -or $report.safety.ordinary_strategy_inputs_emitted -ne $false) { throw 'Unsafe research evidence' }
          if ($report.provenance.terminal_capture_attempted -ne $false) { throw 'Blocked calendar must not touch terminal' }
          if ('HOLIDAY_COVERAGE_UNKNOWN' -notin @($report.requirements)) { throw 'Missing evidence was silently cleared' }
          exit 0
      - name: Offline replay pending and synthetic smoke test
        shell: python
        run: |
          import json, pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory(prefix='iat offline replay ') as folder:
              root = pathlib.Path(folder)
              for manifest, expected in ((None, 3), ('config/examples/replay.synthetic/manifest.json', 2)):
                  report = root / ('pending.json' if manifest is None else 'synthetic.json')
                  args = [sys.executable, 'diagnostics/historical_replay.py', '--report-path', str(report)]
                  if manifest is not None:
                      args += ['--manifest', manifest]
                  result = subprocess.run(args, capture_output=True, text=True)
                  assert result.returncode == expected, 'REPLAY_SMOKE_EXIT_INVALID'
                  data = json.loads(report.read_text(encoding='utf-8'))
                  assert data['historical_validation'] == 'PENDING', 'SYNTHETIC_MUST_NOT_CERTIFY_HISTORY'
                  assert data['safety']['execution_allowed'] is False and data['safety']['broker_access'] is False
                  if manifest is not None:
                      assert data['summary']['snapshots'] == 30 and data['decision_log']['log_version'] == 1
