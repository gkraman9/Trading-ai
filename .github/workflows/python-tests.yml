                  if missing_manifest:
                      args += ['--manifest', str(root / 'missing manifest.json')]
                  result = subprocess.run(args, capture_output=True, text=True)
                  assert result.returncode == (2 if missing_manifest else 3), result.stdout
                  data = json.loads(report.read_text(encoding='utf-8'))
                  assert data['qualification'] == 'DATA_NOT_QUALIFIED' and data['status'] == 'BLOCKED'
                  assert data['historical_validation'] == 'PENDING' and data['historical_comparisons'] == 'NOT_RUN'
                  assert data['ordinary_strategy_inputs_allowed'] is False and data['review_packets_allowed'] is False
                  assert data['safety']['execution_allowed'] is False and data['safety']['broker_access'] is False
                  assert data['safety']['orders_requested'] == 0 and data['safety']['profitability_tested'] is False
