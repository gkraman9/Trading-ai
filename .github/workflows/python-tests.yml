      - name: Scenario assessment is a read-only synthetic context view
        shell: python
        run: |
          import pathlib, sys
          from datetime import datetime, timedelta, timezone
          sys.path.insert(0, str(pathlib.Path.cwd()))
          from iat.intelligence.context import context_at
          from iat.intelligence.scenario_assessment import assess_scenarios, validate_scenario_assessment
          # Explicitly SYNTHETIC flat OHLC; never broker data or market validation.
          start = datetime(2026, 11, 12, 8, tzinfo=timezone.utc)
          def fixture(count, minutes):
              return [dict(timestamp=(start+timedelta(minutes=i*minutes)).isoformat(),
                  open=100.0, high=100.5, low=99.5, close=100.0) for i in range(count)]
          source = context_at('SYNTHETIC_XAUUSD', fixture(15, 1), fixture(3, 5), start+timedelta(minutes=15))
          before = source.to_dict()
          for report in (None, source):
              assessment = assess_scenarios(report)
              assert validate_scenario_assessment(assessment)
              assert assessment['mode'] == 'READ_ONLY_SHADOW' and assessment['signal'] == 'WAIT'
              assert assessment['execution_allowed'] is False and assessment['broker_access'] is False
              assert assessment['exness'] == 'BLOCKED' and assessment['historical_validation'] == 'PENDING'
              assert assessment['historical_comparisons'] == 'NOT_RUN'
              if report is None:
                  assert assessment['status'] == 'BLOCKED' and assessment['ranked_hypotheses'] == []
              else:
                  assert assessment['status'] == 'ABSTAINED'
                  assert assessment['selected_hypothesis'] == source.confluence['selected_hypothesis']
          assert source.to_dict() == before
      - name: Scenario transition read-only semantic smoke test
        shell: python
        run: |
          import json, pathlib, sys
          sys.path.insert(0, str(pathlib.Path.cwd()))
          from iat.intelligence.scenario_transitions import assess_scenario_transition, validate_scenario_transition
          from iat.intelligence.strategy_replay import digest
          report = assess_scenario_transition(None, None)
          assert validate_scenario_transition(json.loads(json.dumps(report)))
          assert report['classification'] == 'BLOCKED'
          assert report['signal'] == 'WAIT' and report['mode'] == 'READ_ONLY_SHADOW'
          assert report['execution_allowed'] is False and report['broker_access'] is False
          assert report['exness'] == 'BLOCKED' and report['historical_validation'] == 'PENDING'
          assert report['historical_comparisons'] == 'NOT_RUN'
          report['classification'] = 'INVALIDATED'
          report['sha256'] = digest({k:v for k,v in report.items() if k != 'sha256'})
          try:
              validate_scenario_transition(report)
          except ValueError:
              pass
          else:
              raise AssertionError('Rechecksummed semantic forgery was accepted')
