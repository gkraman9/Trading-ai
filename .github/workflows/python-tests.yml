permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11.9', '3.12']
        os: [ubuntu-24.04, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check committed provenance metadata bytes
        run: python diagnostics/check_provenance_metadata.py
      - name: Provenance focused tests including stale CRLF checkout regression
        run: python -m unittest discover -s tests -p test_provenance_assessment.py -v
      - name: Exness historical intake focused synthetic tests
        run: python -m unittest discover -s tests -p test_exness_intake.py -v
      - name: Live observer focused read-only tests (synthetic transport only)
        run: python -m unittest discover -s tests -p test_live_observer.py -v
      - name: Live reasoning v2 evidence and mocked-provider tests
        run: python -m unittest discover -s tests -p test_live_reasoning.py -v
      - name: Live AI commentary v3 mocked SDK evidence tests
        run: python -m unittest discover -s tests -p test_live_ai_v3.py -v
      - name: Gemini compact evidence selection (mocked SDK only)
        run: python -m unittest discover -s tests -p test_live_ai_gemini.py -v
      - name: Demo execution Stage A (synthetic transports only)
        run: python -m unittest discover -s tests -p test_demo_execution.py -v
      - name: Stage B offline strategy research (synthetic only)
        run: python -m unittest discover -s tests -p test_strategy_qualification.py -v
      - name: Live shadow recorder (synthetic fixtures, no broker orders)
        run: python -m unittest discover -s tests -p test_live_shadow.py -v
      - name: Three-engine comparison (synthetic and mocked SDKs, no broker orders)
        run: python -m unittest discover -s tests -p test_three_engine.py -v
      - name: Quote acquisition chronology (mocked MT5, no skew allowance)
        run: python -m unittest discover -s tests -p test_shadow_quote_timing.py -v
      - name: Live V3 presentation (synthetic MT5, no services)
        run: python -m unittest discover -s tests -p test_live_market_view.py -v
      - name: Windows live helper validation only (no terminal or service)
        if: runner.os == 'Windows' && startsWith(matrix.python-version, '3.11')
        shell: powershell
        run: |
          & .\diagnostics\Test-IATLiveStartup.ps1 -PythonExe (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { throw 'Live helper -File regression failed' }
      - name: Entry intelligence E1 (independent synthetic OHLC only)
        run: python -m unittest discover -s tests -p test_entry_intelligence.py -v
      - name: E1 independent contract review and E2 synthetic exit research
        run: python -m unittest discover -s tests -p 'test_*independent_review.py' -v
      - name: E2 exit source and ambiguity regressions
        run: python -m unittest discover -s tests -p test_exit_intelligence.py -v
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Windows historical evidence runner (synthetic files, no terminal)
        if: runner.os == 'Windows' && startsWith(matrix.python-version, '3.11')
        shell: pwsh
        run: |
          $env:IAT_BOUNDARY_FIXTURE = Join-Path $env:RUNNER_TEMP ('iat boundary SYNTHETIC ' + [Guid]::NewGuid().ToString('N'))
          @'
          import json, os, pathlib, sys
          sys.path.insert(0, 'tests')
          from test_boundary_reproduction import fixture
          root = pathlib.Path(os.environ['IAT_BOUNDARY_FIXTURE'])
          paths = fixture(root / 'inputs')
          (root / 'paths.json').write_text(json.dumps([str(p) for p in paths]), encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic fixture preparation failed' }
          $paths = Get-Content -LiteralPath (Join-Path $env:IAT_BOUNDARY_FIXTURE 'paths.json') -Raw | ConvertFrom-Json
          $out = Join-Path $env:IAT_BOUNDARY_FIXTURE 'private output with spaces'
          $python = (Get-Command python).Source
          & powershell.exe -NoProfile -File diagnostics/Verify-IATBoundaryEvidence.ps1 -PythonExe $python -M1Csv ($paths[0]) -M5Csv ($paths[1]) -OriginalReport ($paths[2]) -CalendarPath ($paths[3]) -OutputDirectory $out
          if ($LASTEXITCODE -ne 3) { throw 'Expected completed unqualified research' }
          $r = Get-Content -LiteralPath (Join-Path $out 'evidence-summary.json') -Raw | ConvertFrom-Json
          if ($r.status -ne 'DIFFERENCES_FOUND' -or $r.qualification -ne 'DATA_NOT_QUALIFIED' -or $r.execution_allowed -ne $false -or $r.diagnostic.exit_code -ne 3) { throw 'Unsafe research result' }
          foreach ($key in @('M1','M5','original_report','calendar')) {
            if ($r.input_integrity.$key.unchanged -ne $true) { throw 'Input modified' }
          }
          $missingOut = Join-Path $env:IAT_BOUNDARY_FIXTURE 'blocked output'
          & powershell.exe -NoProfile -File diagnostics/Verify-IATBoundaryEvidence.ps1 -PythonExe $python -M1Csv (Join-Path $env:IAT_BOUNDARY_FIXTURE 'missing.csv') -M5Csv ($paths[1]) -OriginalReport ($paths[2]) -CalendarPath ($paths[3]) -OutputDirectory $missingOut
          if ($LASTEXITCODE -ne 2) { throw 'Missing input must remain BLOCKED' }
          $blocked = Get-Content -LiteralPath (Join-Path $missingOut 'evidence-summary.json') -Raw | ConvertFrom-Json
          if ($blocked.status -ne 'BLOCKED' -or $blocked.comparison.status -ne 'NOT_RUN' -or $blocked.execution_allowed -ne $false) { throw 'Unsafe missing-input report' }
          exit 0
      - name: Windows runner fail-closed smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $reports = Join-Path $env:RUNNER_TEMP ('iat-smoke-' + [Guid]::NewGuid().ToString('N'))
          $python = (Get-Command python).Source
          & powershell.exe -NoProfile -File diagnostics/Run-IATDemoValidation.ps1 -PythonExe $python -SessionConfig 'missing-fixture.json' -ReportDirectory $reports
          if ($LASTEXITCODE -ne 1) { Write-Output '::error::SMOKE_EXPECTED_FAIL_CLOSED_EXIT'; exit 1 }
          $files = @(Get-ChildItem -LiteralPath $reports -Filter '*.json')
          if ($files.Count -ne 1) { Write-Output '::error::SMOKE_FAILURE_REPORT_MISSING'; exit 1 }
          $report = Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          if ($report.status -ne 'FAIL' -or $report.execution_allowed -ne $false) { Write-Output '::error::SMOKE_UNSAFE_FAILURE_REPORT'; exit 1 }
          if ($report.code -notin @('CONFIG_FILE_UNAVAILABLE', 'PYTHON_311_X64_REQUIRED')) { Write-Output ('::error::SMOKE_UNEXPECTED_PREFLIGHT_CODE_' + $report.code); exit 1 }
          # GitHub's pwsh wrapper otherwise propagates the intentionally failing child's LASTEXITCODE.
          exit 0
      - name: Windows runner missing-package evidence test
        if: runner.os == 'Windows' && startsWith(matrix.python-version, '3.11')
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('iat smoke with spaces ' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root | Out-Null
          $env:IAT_SMOKE_CONFIG = Join-Path $root 'config with spaces.json'
          @'
          import importlib.util, json, os, sys
          from pathlib import Path
          assert importlib.util.find_spec('MetaTrader5') is None, 'No real terminal package may be loaded in this smoke check'
          sys.path.insert(0, 'tests')
          from test_session_config import fixture
          Path(os.environ['IAT_SMOKE_CONFIG']).write_text(json.dumps(fixture()), encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Smoke environment must have no MT5 package' }
          $reports = Join-Path $root 'evidence with spaces'
          $python = (Get-Command python).Source
          & powershell.exe -NoProfile -File diagnostics/Run-IATDemoValidation.ps1 -PythonExe $python -SessionConfig $env:IAT_SMOKE_CONFIG -ReportDirectory $reports
          if ($LASTEXITCODE -ne 1) { throw 'Missing MT5 must fail closed' }
          $files = @(Get-ChildItem -LiteralPath $reports -Filter '*.json')
          if ($files.Count -ne 1) { throw 'Expected one completed failure report' }
          $report = Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          if ($report.status -ne 'FAIL' -or $report.safety.execution_allowed -ne $false) { throw 'Unsafe diagnostic outcome' }
          if ('MT5_UNAVAILABLE' -notin @($report.diagnostics.code)) { throw 'Expected structured missing-package diagnostic' }
          exit 0
      - name: Windows Exness candidate installer and blocked-run smoke test
        if: runner.os == 'Windows' && startsWith(matrix.python-version, '3.11')
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('iat exness with spaces ' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root | Out-Null
          $candidate = Join-Path $root 'candidate with spaces.json'
          $python = (Get-Command python).Source
          & powershell.exe -NoProfile -NonInteractive -File diagnostics/Install-IATExnessCalendar.ps1 -PythonExe $python -Destination $candidate
          if ($LASTEXITCODE -ne 2 -or -not (Test-Path -LiteralPath $candidate)) { throw 'Expected installed but BLOCKED candidate' }
          $before = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash
          & powershell.exe -NoProfile -NonInteractive -File diagnostics/Install-IATExnessCalendar.ps1 -PythonExe $python -Destination $candidate
          if ($LASTEXITCODE -ne 1) { throw 'Replacement must require interactive confirmation' }
          if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash -ne $before) { throw 'Unconfirmed overwrite occurred' }
          $reports = Join-Path $root 'evidence with spaces'
          & powershell.exe -NoProfile -File diagnostics/Run-IATDemoValidation.ps1 -PythonExe $python -SessionConfig $candidate -ReportDirectory $reports
          if ($LASTEXITCODE -ne 1) { throw 'Unverified candidate must fail closed' }
          $files = @(Get-ChildItem -LiteralPath $reports -Filter '*.json')
          if ($files.Count -ne 1) { throw 'Expected one redacted failure report' }
          $report = Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          if ($report.status -ne 'FAIL' -or $report.safety.execution_allowed -ne $false -or $report.safety.binding_initialization_attempted -ne $false) { throw 'Unsafe Exness candidate handling' }
          if ('HOLIDAY_COVERAGE_UNKNOWN' -notin @($report.diagnostics.code)) { throw 'Holiday uncertainty was hidden' }
          if ('SESSION_ALIGNMENT_INVALID' -notin @($report.timeframes.M5.codes)) { throw 'M5 boundary mismatch was hidden' }
          exit 0
      - name: Windows v2 research remains blocked without terminal access
        if: runner.os == 'Windows' && startsWith(matrix.python-version, '3.11')
        shell: pwsh
        run: |
          $reports = Join-Path $env:RUNNER_TEMP ('iat v2 research ' + [Guid]::NewGuid().ToString('N'))
          $python = (Get-Command python).Source
          & powershell.exe -NoProfile -File diagnostics/Run-IATSessionResearch.ps1 -PythonExe $python -SessionConfig 'config/profiles/exness-xauusd-v2.candidate.json' -ReportDirectory $reports -CaptureDemo
          if ($LASTEXITCODE -ne 3) { throw 'Unverified v2 profile must remain BLOCKED' }
          $files = @(Get-ChildItem -LiteralPath $reports -Filter '*.json')
          if ($files.Count -ne 1) { throw 'Expected one v2 research report' }
          $report = Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          if ($report.status -ne 'BLOCKED' -or $report.safety.execution_allowed -ne $false -or $report.safety.ordinary_strategy_inputs_emitted -ne $false) { throw 'Unsafe research evidence' }
          if ($report.provenance.terminal_capture_attempted -ne $false) { throw 'Blocked calendar must not touch terminal' }
          if ('HOLIDAY_COVERAGE_UNKNOWN' -notin @($report.requirements)) { throw 'Missing evidence was silently cleared' }
          exit 0
      - name: Offline replay pending and synthetic smoke test
        shell: python
        run: |
          import json, pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory(prefix='iat offline replay ') as folder:
              root = pathlib.Path(folder)
              for manifest, expected in ((None, 3), ('config/examples/replay.synthetic/manifest.json', 2)):
                  report = root / ('pending.json' if manifest is None else 'synthetic.json')
                  args = [sys.executable, 'diagnostics/historical_replay.py', '--report-path', str(report)]
                  if manifest is not None:
                      args += ['--manifest', manifest]
                  result = subprocess.run(args, capture_output=True, text=True)
                  assert result.returncode == expected, 'REPLAY_SMOKE_EXIT_INVALID'
                  data = json.loads(report.read_text(encoding='utf-8'))
                  assert data['historical_validation'] == 'PENDING', 'SYNTHETIC_MUST_NOT_CERTIFY_HISTORY'
                  assert data['safety']['execution_allowed'] is False and data['safety']['broker_access'] is False
                  if manifest is not None:
                      assert data['summary']['snapshots'] == 30 and data['decision_log']['log_version'] == 1

      - name: Manifest-gated strategy replay remains pending without an export
        shell: python
        run: |
          import json, pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory(prefix='iat strategy dataset ') as folder:
              report = pathlib.Path(folder) / 'private report.json'
              result = subprocess.run([sys.executable, 'diagnostics/strategy_dataset_replay.py', '--report-path', str(report)], capture_output=True, text=True)
              assert result.returncode == 3, 'EXPECTED_DATASET_UNAVAILABLE'
              data = json.loads(report.read_text(encoding='utf-8'))
              assert data['historical_validation'] == 'PENDING' and data['historical_comparisons'] == 'NOT_RUN'
              assert data['strategy_replay_log'] is None and data['historical_metrics'] is None
              assert data['safety']['execution_allowed'] is False and data['exness'] == 'BLOCKED'

      - name: Journal dataset evaluation stays pending without an export
        shell: python
        run: |
          import json, pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory(prefix='iat private journal ') as folder:
              report = pathlib.Path(folder) / 'pending journal report.json'
              result = subprocess.run([sys.executable, 'diagnostics/journal_dataset_replay.py', '--report-path', str(report)], capture_output=True, text=True)
              assert result.returncode == 3, 'EXPECTED_JOURNAL_DATASET_UNAVAILABLE'
              data = json.loads(report.read_text(encoding='utf-8'))
              assert data['historical_validation'] == 'PENDING' and data['historical_comparisons'] == 'NOT_RUN'
              assert data['reasoning_journal'] is None and data['accounting'] is None and data['historical_metrics'] is None
              assert data['exness'] == 'BLOCKED' and data['safety']['execution_allowed'] is False

      - name: Blinded benchmark rejects missing dataset without publishing packets
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory(prefix='iat blinded benchmark ') as folder:
              root = pathlib.Path(folder)
              output = root / 'review batch'
              result = subprocess.run([sys.executable, 'diagnostics/chart_benchmark.py', 'prepare', '--manifest', str(root / 'missing.json'), '--at', '2026-11-12T08:23:00Z', '--reviewer', 'anonymous-a', '--output-directory', str(output)], capture_output=True, text=True)
              assert result.returncode == 3, 'EXPECTED_PREFLIGHT_REJECTION'
              assert not output.exists(), 'NO_PACKET_WITHOUT_ELIGIBLE_DATA'

      - name: Real review pilot refuses unavailable data without synthetic fallback
        shell: python
        run: |
          import json, pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory(prefix='iat real review pilot ') as folder:
              report = pathlib.Path(folder) / 'qualification.json'
              result = subprocess.run([sys.executable, 'diagnostics/review_pilot.py', 'qualify', '--report-path', str(report)], capture_output=True, text=True)
              assert result.returncode == 3, 'EXPECTED_DATA_NOT_QUALIFIED'
              data = json.loads(report.read_text(encoding='utf-8'))
              assert data['status'] == 'DATA_NOT_QUALIFIED'
              assert data['historical_validation'] == 'PENDING' and data['historical_comparisons'] == 'NOT_RUN'
              assert data['safety']['execution_allowed'] is False and data['exness'] == 'BLOCKED'

      - name: Qualification assistant rejects missing metadata without approval
        shell: python
        run: |
          import json, pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory(prefix='iat import assistant ') as folder:
              root = pathlib.Path(folder)
              report = root / 'report.json'
              result = subprocess.run([sys.executable, 'diagnostics/qualification_assistant.py', 'validate', '--spec', str(root / 'missing.json'), '--report-path', str(report)], capture_output=True, text=True)
              assert result.returncode == 3, 'EXPECTED_DATA_NOT_QUALIFIED'
              data = json.loads(report.read_text(encoding='utf-8'))
              assert data['status'] == 'DATA_NOT_QUALIFIED' and data['mechanical']['status'] == 'BLOCKED'
              assert data['independent_signoff']['decision'] == 'PENDING'
              assert data['safety']['execution_allowed'] is False and data['exness'] == 'BLOCKED'

      - name: Real-data preparation Windows runner stays offline and blocks missing M1
        if: runner.os == 'Windows' && matrix.python-version == '3.11.9'
        shell: python
        run: |
          import json, pathlib, subprocess, sys, tempfile
          sys.path.insert(0, str(pathlib.Path.cwd()))
          sys.path.insert(0, str(pathlib.Path.cwd() / 'tests'))
          from test_qualification_assistant import export_fixture
          with tempfile.TemporaryDirectory(prefix='iat prep Windows ') as folder:
              root = pathlib.Path(folder)
              spec = export_fixture(root)
              data = json.loads(spec.read_text(encoding='utf-8'))
              output = root / 'private output'
              result = subprocess.run(['pwsh', '-NoProfile', '-File', 'diagnostics/Prepare-IATRealDataPilot.ps1', '-M5Csv', str(root / data['frames']['M5']['file']), '-ImportSpec', str(spec), '-StartUtc', data['utc_range']['start'], '-EndUtc', data['utc_range']['end'], '-EvaluationStartUtc', data['evaluation']['start'], '-OutputDirectory', str(output), '-PythonExe', sys.executable, '-DryRun'], capture_output=True, text=True)
              assert result.returncode == 3, 'EXPECTED_BLOCKED_READINESS'
              report = json.loads((output / 'review-readiness.json').read_text(encoding='utf-8'))
              assert 'MISSING_NATIVE_M1' in report['reason_codes'] and report['review_packets_created'] is False
              assert report['safety']['execution_allowed'] is False
              assert not (output / 'selection').exists(), 'DRY_RUN_MUST_NOT_NORMALIZE'

      - name: Historical session-boundary research fails closed without local files
        shell: python
        run: |
          import json, pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory(prefix='iat session boundary ') as folder:
              report = pathlib.Path(folder) / 'research.json'
              result = subprocess.run([sys.executable, 'diagnostics/historical_session_boundaries.py',
                  '--m1', str(pathlib.Path(folder) / 'missing M1.csv'),
                  '--m5', str(pathlib.Path(folder) / 'missing M5.csv'),
                  '--calendar', 'config/profiles/exness-xauusd-v2.candidate.json',
                  '--timestamp-column', 'timestamp_utc', '--start-utc', '2026-11-11T00:00:00Z',
                  '--end-utc', '2026-11-14T00:00:00Z', '--report-path', str(report)], capture_output=True, text=True)
              assert result.returncode == 3
              data = json.loads(report.read_text(encoding='utf-8'))
              assert data['status'] == 'UNAVAILABLE' and data['qualification'] == 'DATA_NOT_QUALIFIED'
              assert data['historical_validation'] == 'PENDING' and data['historical_comparisons'] == 'NOT_RUN'
              assert data['safety']['execution_allowed'] is False and data['exness'] == 'BLOCKED'

      - name: Evidence manifest stays unqualified in reported and missing-source modes
        shell: python
        run: |
          import json, pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory(prefix='iat evidence with spaces ') as folder:
              root = pathlib.Path(folder)
              for mode, expected in (('reported', 3), ('verify', 2)):
                  report = root / (mode + '.json')
                  args = [sys.executable, 'diagnostics/historical_evidence_manifest.py', mode,
                      '--observations', 'config/examples/historical-evidence/operator-reported-v1.json',
                      '--report-path', str(report)]
                  if mode == 'verify':
                      args += ['--m1', str(root / 'missing M1.csv'), '--m5', str(root / 'missing M5.csv'),
                          '--diagnostic', str(root / 'missing report.json'),
                          '--calendar', 'config/profiles/exness-xauusd-v2.candidate.json']
                  result = subprocess.run(args, capture_output=True, text=True)
                  assert result.returncode == expected, result.stdout
                  data = json.loads(report.read_text(encoding='utf-8'))
                  assert data['qualification'] == 'DATA_NOT_QUALIFIED' and data['exness'] == 'BLOCKED'
                  assert data['historical_validation'] == 'PENDING' and data['historical_comparisons'] == 'NOT_RUN'
                  assert data['safety']['execution_allowed'] is False and data['safety']['orders_requested'] == 0
                  assert data['reproduction']['status'] == 'NOT_REPRODUCED'
                  if mode == 'reported':
                      assert data['local_facts'] is None and data['evidence_state'] == 'OPERATOR_REPORTED'
                  else:
                      assert data['evidence_state'] == 'INVALID_OR_CONFLICTING_EVIDENCE'

      - name: Independent source review stays offline and unqualified
        shell: python
        run: |
          import json, pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory(prefix='iat independent source ') as folder:
              root = pathlib.Path(folder)
              for missing_manifest in (False, True):
                  report = root / ('invalid.json' if missing_manifest else 'review.json')
                  args = [sys.executable, 'diagnostics/independent_source_review.py',
                      '--registry', 'config/examples/independent-source-review/exness-review-v1.json',
